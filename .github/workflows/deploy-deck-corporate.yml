name: Deploy Deck Corporate

on:
  push:
    branches:
      - feature/corporate-landing-lineamiento
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deck-corporate
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site with preview folder
        run: |
          set -e
          mkdir -p _site/previews/01-corporate
          git archive --format=tar HEAD | tar -xf - -C _site
          git archive --format=tar HEAD | tar -xf - -C _site/previews/01-corporate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
